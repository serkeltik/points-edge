<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POINTS_EDGE // MISSION_HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tomorrow:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-orange: #FF6600;
            --neon-green: #00FF9F;
            --cyber-black: #050505;
            --panel-grey: #1a1a1a;
        }

        body {
            background-color: var(--cyber-black);
            color: #ffffff;
            font-family: 'Tomorrow', sans-serif;
            background-image: 
                radial-gradient(circle at 1px 1px, rgba(255, 102, 0, 0.04) 1px, transparent 0),
                linear-gradient(rgba(0, 255, 159, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 159, 0.01) 1px, transparent 1px);
            background-size: 20px 20px, 80px 80px, 80px 80px;
        }

        @keyframes storm-glitch {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 159, 0.1); border-color: rgba(0, 255, 159, 0.2); }
            5% { box-shadow: 0 0 35px rgba(0, 255, 159, 0.5), inset 0 0 15px rgba(0, 255, 159, 0.2); border-color: rgba(0, 255, 159, 0.8); }
            9% { box-shadow: 0 0 60px rgba(0, 255, 159, 0.8), inset 0 0 20px rgba(0, 255, 159, 0.4); border-color: rgba(0, 255, 159, 1); }
        }

        .lightning-storm {
            animation: storm-glitch 5s infinite linear;
            border: 2px solid rgba(0, 255, 159, 0.3);
        }

        .neon-glow-orange { color: var(--neon-orange); text-shadow: 0 0 10px rgba(255, 102, 0, 0.7); }
        .neon-glow-green { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 159, 0.7); }

        .hud-panel {
            background: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 102, 0, 0.2);
            position: relative;
        }

        input, select { 
            background: #0a0a0a !important;
            border: 1px solid #444 !important;
            color: var(--neon-orange) !important;
            font-family: 'monospace';
            font-size: 0.85rem !important;
            padding: 0.4rem !important;
            width: 100%;
        }

        label {
            font-size: 10px;
            letter-spacing: 0.1em;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 2px;
            display: block;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <main class="max-w-7xl mx-auto space-y-8 p-4 lightning-storm rounded-2xl bg-black">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-zinc-800 pb-6 px-4">
            <div>
                <p class="text-[10px] tracking-[0.4em] text-zinc-500 uppercase font-black italic">[V9.0_REBUILT_MASTER]</p>
                <h1 class="text-3xl md:text-5xl font-black neon-glow-orange uppercase tracking-tighter">Points Edge Dashboard</h1>
            </div>
            <div class="text-green-400 text-[10px] flex items-center gap-2 font-mono uppercase bg-zinc-900 p-2 border border-zinc-800">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> SYSTEM_ONLINE
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <section class="lg:col-span-5 space-y-6">
                <div class="hud-panel p-6 rounded-xl">
                    <h2 class="text-xs font-black text-orange-500 uppercase mb-4 tracking-widest">> MISSION_PARAMETERS</h2>
                    <div id="inputContainer" class="space-y-4">
                        </div>
                </div>
            </section>

            <section class="lg:col-span-7 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="hud-panel p-6 rounded-xl text-center">
                        <label>Monthly Yield</label>
                        <p id="monthlyPoints" class="text-4xl font-black neon-glow-orange">0</p>
                    </div>
                    <div class="hud-panel p-6 rounded-xl text-center">
                        <label>Annual Extraction</label>
                        <p id="annualValue" class="text-4xl font-black neon-glow-green">$0</p>
                    </div>
                </div>

                <div class="hud-panel p-6 rounded-xl" style="height: 300px;">
                    <canvas id="breakdownChart"></canvas>
                </div>
            </section>
        </div>
    </main>

    <script>
        const cardDatabase = [
            { id: 'csr', name: 'Chase Sapphire Reserve', multipliers: { flight: 4, hotel: 4, travel: 1, dining: 3, grocery: 1, gas: 1, drugstores: 1, everyday: 1 } },
            { id: 'freedom', name: 'Freedom Unlimited', multipliers: { flight: 1.5, hotel: 1.5, travel: 1.5, dining: 3, grocery: 1.5, gas: 1.5, drugstores: 3, everyday: 1.5 } },
            { id: 'bilt', name: 'Bilt Rewards', multipliers: { flight: 2, hotel: 2, travel: 2, dining: 3, grocery: 1, gas: 1, drugstores: 1, everyday: 1 } },
            { id: 'venture_x', name: 'Cap1 Venture X', multipliers: { flight: 2, hotel: 2, travel: 2, dining: 2, grocery: 2, gas: 2, drugstores: 2, everyday: 2 } }
        ];

        const categories = [
            { key: 'flight', label: 'Flights' },
            { key: 'hotel', label: 'Hotels' },
            { key: 'dining', label: 'Dining' },
            { key: 'drugstores', label: 'Drugstores' },
            { key: 'everyday', label: 'Everyday Spend' }
        ];

        let breakdownChart;

        function createSelectors() {
            const container = document.getElementById('inputContainer');
            categories.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'grid grid-cols-2 gap-2 border-b border-zinc-800 pb-2';
                div.innerHTML = `
                    <div>
                        <label>${cat.label} ($)</label>
                        <input type="number" id="${cat.key}Spend" placeholder="0">
                    </div>
                    <div>
                        <label>Hardware</label>
                        <select id="${cat.key}Card">
                            ${cardDatabase.map(card => `<option value="${card.id}">${card.name}</option>`).join('')}
                        </select>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateHUD() {
            let totalAnnPoints = 0;
            const data = [];
            const labels = [];

            categories.forEach(cat => {
                const spend = parseFloat(document.getElementById(`${cat.key}Spend`).value) || 0;
                const cardId = document.getElementById(`${cat.key}Card`).value;
                const card = cardDatabase.find(c => c.id === cardId);
                const points = (spend * card.multipliers[cat.key]) * 12;
                totalAnnPoints += points;
                data.push(points);
                labels.push(cat.label);
            });

            document.getElementById('monthlyPoints').innerText = Math.floor(totalAnnPoints / 12).toLocaleString();
            document.getElementById('annualValue').innerText = '$' + Math.floor(totalAnnPoints * 0.0205).toLocaleString();

            if (breakdownChart) {
                breakdownChart.data.labels = labels;
                breakdownChart.data.datasets[0].data = data;
                breakdownChart.update();
            }
        }

        window.onload = () => {
            createSelectors();
            const ctx = document.getElementById('breakdownChart').getContext('2d');
            breakdownChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: [], datasets: [{ data: [], backgroundColor: '#FF6600', borderRadius: 5 }]},
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { ticks: { color: '#888', font: { family: 'Tomorrow' } } } }
                }
            });
            document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', updateHUD));
        };
    </script>
</body>
</html>
