<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POINTS_EDGE // MISSION_HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tomorrow:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-orange: #FF6600;
            --neon-green: #00FF9F;
            --cyber-black: #050505;
            --panel-grey: #1a1a1a;
            --rakuten-purple: #9d00ff;
        }

        body {
            background-color: var(--cyber-black);
            color: #ffffff;
            font-family: 'Tomorrow', sans-serif;
            background-image: 
                radial-gradient(circle at 1px 1px, rgba(255, 102, 0, 0.04) 1px, transparent 0),
                linear-gradient(rgba(0, 255, 159, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 159, 0.01) 1px, transparent 1px);
            background-size: 20px 20px, 80px 80px, 80px 80px;
        }

        @keyframes storm-glitch {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 159, 0.1); border-color: rgba(0, 255, 159, 0.2); }
            5% { box-shadow: 0 0 35px rgba(0, 255, 159, 0.5), inset 0 0 15px rgba(0, 255, 159, 0.2); border-color: rgba(0, 255, 159, 0.8); }
            7% { box-shadow: 0 0 20px rgba(0, 255, 159, 0.2); border-color: rgba(0, 255, 159, 0.3); }
            9% { box-shadow: 0 0 60px rgba(0, 255, 159, 0.8), inset 0 0 20px rgba(0, 255, 159, 0.4); border-color: rgba(0, 255, 159, 1); }
            11% { box-shadow: 0 0 30px rgba(0, 255, 159, 0.2); border-color: rgba(0, 255, 159, 0.3); }
        }

        .lightning-storm {
            animation: storm-glitch 5s infinite linear;
            border: 2px solid rgba(0, 255, 159, 0.3);
        }

        .neon-glow-orange {
            color: var(--neon-orange);
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.7);
        }

        .hud-panel {
            background: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 102, 0, 0.2);
            position: relative;
        }

        input, select { 
            background: #0a0a0a !important;
            border: 1px solid #444 !important;
            color: var(--neon-orange) !important;
            font-family: 'Courier New', Courier, monospace;
            padding: 0.5rem !important;
        }

        label {
            font-size: 9px;
            letter-spacing: 0.12em;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <main class="max-w-7xl mx-auto space-y-8 relative p-4 lightning-storm rounded-2xl">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-zinc-800 pb-6 px-4">
            <div>
                <p class="text-[10px] tracking-[0.4em] text-zinc-500 uppercase font-black mb-1 italic">
                    [SYSTEM_READY] // PROTOCOL_V9.0 // SPEND_ONLY_MODE
                </p>
                <h1 class="text-3xl md:text-5xl font-black neon-glow-orange uppercase tracking-tighter">
                    Points Edge Dashboard
                </h1>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 p-4">
            <section class="lg:col-span-5 space-y-6">
                <div class="hud-panel p-6 rounded-xl border border-zinc-800">
                    <h2 class="text-xs font-black tracking-[0.4em] text-orange-500 uppercase mb-3">> MISSION_PARAMETERS</h2>
                    <div class="space-y-5" id="inputContainer">
                        </div>
                </div>
            </section>

            <section class="lg:col-span-7 space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="hud-panel p-8 rounded-xl bg-black/40 border border-zinc-800">
                        <p class="text-lg text-zinc-300 uppercase font-black mb-3">Monthly Yield</p>
                        <p id="monthlyPoints" class="text-5xl font-black neon-glow-orange">0</p>
                        <p id="rakutenMonthlySub" class="text-[10px] text-purple-400 italic mt-4">+0 Rakuten Potential</p>
                    </div>
                    <div class="hud-panel p-8 rounded-xl border-zinc-800 bg-black/40">
                        <p class="text-lg text-zinc-300 uppercase font-black mb-3">Annual Valuation</p>
                        <p id="annualValue" class="text-5xl font-black text-[#00FF9F]">$0</p>
                        <p class="text-[10px] text-zinc-600 italic mt-4">@ 2.05 CPP Protocol</p>
                    </div>
                </div>

                <div class="hud-panel p-8 rounded-xl border-zinc-800 bg-black/20">
                    <div style="height: 250px; width: 100%;">
                        <canvas id="breakdownChart"></canvas>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const cardDatabase = [
            { id: 'csr', name: 'Sapphire Reserve', multipliers: { flight: 4, hotel: 4, travel: 1, dining: 3, grocery: 1, everyday: 1 } },
            { id: 'platinum', name: 'Amex Platinum', multipliers: { flight: 5, hotel: 1, travel: 1, dining: 1, grocery: 1, everyday: 1 } },
            { id: 'venture_x', name: 'Cap1 Venture X', multipliers: { flight: 2, hotel: 2, travel: 2, dining: 2, grocery: 2, everyday: 2 } }
        ];

        const categories = [
            { key: 'flight', label: 'Flights' },
            { key: 'hotel', label: 'Hotels' },
            { key: 'dining', label: 'Dining' },
            { key: 'grocery', label: 'Groceries' },
            { key: 'everyday', label: 'Everyday Catch-all' }
        ];

        let breakdownChart;

        function createSelectors() {
            const container = document.getElementById('inputContainer');
            categories.forEach(cat => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-12 gap-3 items-end border-b border-zinc-800 pb-3';
                row.innerHTML = `
                    <div class="col-span-5"><label>${cat.label}</label><input type="number" id="${cat.key}Spend" class="w-full" placeholder="0"></div>
                    <div class="col-span-7"><label>Hardware</label><select id="${cat.key}Card" class="w-full">
                    ${cardDatabase.map(card => `<option value="${card.id}">${card.name}</option>`).join('')}</select></div>`;
                container.appendChild(row);
            });
        }

        function updateHUD() {
            let cardAnnTotal = 0;
            let rakutenAnn = 0;
            const chartData = [];
            const chartLabels = [];

            categories.forEach(cat => {
                const spend = parseFloat(document.getElementById(`${cat.key}Spend`).value) || 0;
                const cardId = document.getElementById(`${cat.key}Card`).value;
                const card = cardDatabase.find(c => c.id === cardId);
                const mult = card.multipliers[cat.key];
                const catAnn = (spend * mult) * 12;
                cardAnnTotal += catAnn;

                if (cat.key === 'everyday') { rakutenAnn = (spend * 0.5 * 3) * 12; }
                chartData.push(catAnn);
                chartLabels.push(cat.label.toUpperCase());
            });

            document.getElementById('monthlyPoints').innerText = Math.floor(cardAnnTotal / 12).toLocaleString();
            document.getElementById('rakutenMonthlySub').innerText = `+${Math.floor(rakutenAnn / 12).toLocaleString()} Rakuten Potential`;
            document.getElementById('annualValue').innerText = '$' + Math.floor((cardAnnTotal + rakutenAnn) * 0.0205).toLocaleString();

            if (breakdownChart) {
                breakdownChart.data.labels = [...chartLabels, 'RAKUTEN'];
                breakdownChart.data.datasets[0].data = [...chartData, rakutenAnn];
                breakdownChart.update();
            }
        }

        window.onload = () => {
            createSelectors();
            const ctx = document.getElementById('breakdownChart').getContext('2d');
            breakdownChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: [], datasets: [{ data: [], backgroundColor: '#FF6600', borderRadius: 3 }]},
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { ticks: { color: '#888', font: { family: 'Tomorrow' } } } } }
            });
            document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', updateHUD));
        };
    </script>
</body>
</html>
